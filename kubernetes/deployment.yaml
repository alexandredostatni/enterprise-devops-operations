
apiVersion: apps/v1
kind: Deployment

metadata:
  name: orders-api
  namespace: techcorp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: orders-api

  template:
    metadata:
      labels:
        app: orders-api

    spec:
      imagePullSecrets:
        - name: ecr-registry

      containers:
        - name: orders-api
          image: 588884340935.dkr.ecr.us-east-2.amazonaws.com/techcorp-devops-orders:v1

          envFrom:
            - configMapRef:
                name: orders-config

          ports:
            - containerPort: 5000

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
